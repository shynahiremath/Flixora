<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search & Explore — Netflix Streaming</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/browse.css" />
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col antialiased selection:bg-red-600 selection:text-white">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 glass-nav border-b border-zinc-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="/browse/home.html" class="text-2xl sm:text-3xl font-black tracking-wider text-red-600 font-mono">NETFLIX</a>
        <div class="hidden md:flex items-center gap-6 text-xs font-bold text-zinc-300 uppercase tracking-wider">
          <a href="/browse/home.html" class="hover:text-white transition" data-i18n="nav_home">Home</a>
          <a href="/browse/search.html" class="text-white border-b-2 border-red-600 pb-1" data-i18n="nav_movies">Search & Categories</a>
          <a href="/browse/mylist.html" class="hover:text-white transition" data-i18n="nav_mylist">My List</a>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Language Switcher Selector Dropdown -->
        <div class="relative">
          <button onclick="toggleLangMenu()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 text-xs font-bold transition cursor-pointer" title="Switch Language">
            <span>🌐</span>
            <span id="current-lang-label">English</span>
            <span class="text-[10px] text-zinc-400">▼</span>
          </button>
          <div id="lang-dropdown-menu" class="hidden absolute right-0 mt-2 w-40 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl p-2 z-50 animate-fade-in text-xs font-bold space-y-1">
            <button onclick="setAppLanguage('en')" class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-zinc-800 text-zinc-200 transition cursor-pointer">
              <span>English</span>
              <span id="check-lang-en" class="text-red-500">✓</span>
            </button>
            <button onclick="setAppLanguage('hi')" class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-zinc-800 text-zinc-200 transition cursor-pointer">
              <span>हिंदी (Hindi)</span>
              <span id="check-lang-hi" class="text-red-500 hidden">✓</span>
            </button>
          </div>
        </div>

        <button onclick="toggleAIAssistant()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 text-xs font-bold transition cursor-pointer">
          ✨ AI Assistant
        </button>
        <a href="/browse/profile.html" class="p-1 rounded-lg border border-zinc-800 hover:border-red-600 transition">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Profile" class="w-8 h-8 rounded object-cover" />
        </a>
      </div>
    </div>
  </nav>

  <!-- SEARCH HEADER & FILTERS -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-8">
    
    <!-- Search Bar Input with Voice Microphone -->
    <div class="relative max-w-3xl mx-auto">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <input type="text" id="search-input" placeholder="What do you want to watch? (Titles, actors, directors, genres...)" data-i18n-placeholder="search_placeholder" class="w-full pl-12 pr-12 py-4 rounded-2xl bg-zinc-900/90 border border-zinc-700/80 text-white placeholder-zinc-500 text-base focus:outline-none focus:border-red-600 shadow-2xl transition" />
      <button id="voice-search-btn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-zinc-400 hover:text-red-500 transition cursor-pointer" title="Voice Search (Click & Speak)">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
      </button>
    </div>

    <!-- Filter Chips Controls -->
    <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-zinc-900/60 border border-zinc-800">
      <div class="flex flex-wrap items-center gap-3">
        <!-- Kids Special Toggle Button -->
        <button id="search-kids-btn" class="px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-yellow-400 hover:text-black text-zinc-200 border border-zinc-700 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
          <span>🎈</span> <span data-i18n="search_kids_filter">Kids & Family Only</span>
        </button>
        <!-- Genre Filter -->
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Genre</label>
          <select id="search-genre-filter" class="bg-zinc-800 text-xs text-zinc-200 px-3 py-2 rounded-xl border border-zinc-700 focus:outline-none cursor-pointer">
            <option value="">All Genres</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Romance">Romance</option>
            <option value="Comedy">Comedy</option>
            <option value="Animated">Animated</option>
            <option value="Thriller">Thriller</option>
            <option value="Psychological">Psychological</option>
            <option value="Indian Cinema">Indian Cinema</option>
          </select>
        </div>

        <!-- Release Year -->
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Year</label>
          <select id="search-year-filter" class="bg-zinc-800 text-xs text-zinc-200 px-3 py-2 rounded-xl border border-zinc-700 focus:outline-none cursor-pointer">
            <option value="">All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
          </select>
        </div>

        <!-- Rating Filter -->
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Min Rating</label>
          <select id="search-rating-filter" class="bg-zinc-800 text-xs text-zinc-200 px-3 py-2 rounded-xl border border-zinc-700 focus:outline-none cursor-pointer">
            <option value="0">All Ratings</option>
            <option value="8.8">★ 8.8+ Top Masterpieces</option>
            <option value="8.5">★ 8.5+</option>
            <option value="8.0">★ 8.0+</option>
          </select>
        </div>

        <!-- Language Filter -->
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Language</label>
          <select id="search-language-filter" class="bg-zinc-800 text-xs text-zinc-200 px-3 py-2 rounded-xl border border-zinc-700 focus:outline-none cursor-pointer">
            <option value="">All Languages</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Kannada">Kannada</option>
            <option value="Telugu">Telugu</option>
            <option value="Tamil">Tamil</option>
            <option value="Malayalam">Malayalam</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
          </select>
        </div>
      </div>

      <span id="search-count" class="text-xs text-zinc-400 font-semibold">0 titles found</span>
    </div>

    <!-- Results Grid -->
    <div id="search-results-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
      <!-- Dynamically generated in search.js -->
    </div>

    <!-- Empty State -->
    <div id="search-empty-state" class="hidden text-center py-20 max-w-md mx-auto space-y-4">
      <div class="text-5xl">🔍</div>
      <h3 class="text-xl font-bold text-white">Couldn't find anything matching your search.</h3>
      <p class="text-xs text-zinc-400">Try searching for a different keyword, title, genre, or clear your category filters.</p>
    </div>

  </main>

  <footer class="bg-zinc-950 border-t border-zinc-900 py-8 text-center text-zinc-500 text-xs">
    <p>© 2026 Netflix — Educational Portfolio Project</p>
  </footer>

  <!-- auth.js MUST load first: it checks the JWT with the backend
       before the page's real content logic (search.js) runs -->
  <script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script>
  Auth.requireAuth();
</script>
<script src="/js/app.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
