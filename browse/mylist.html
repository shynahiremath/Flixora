<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My List — Netflix</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/browse.css" />
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col antialiased selection:bg-red-600 selection:text-white">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 glass-nav border-b border-zinc-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="/browse/home.html" class="text-2xl sm:text-3xl font-black tracking-wider text-red-600 font-mono">NETFLIX</a>
        <div class="hidden md:flex items-center gap-6 text-xs font-bold text-zinc-300 uppercase tracking-wider">
          <a href="/browse/home.html" class="hover:text-white transition">Home</a>
          <a href="/browse/search.html" class="hover:text-white transition">Search</a>
          <a href="/browse/mylist.html" class="text-white border-b-2 border-red-600 pb-1">My List</a>
        </div>
      </div>

      <a href="/browse/profile.html" class="p-1 rounded-lg border border-zinc-800 hover:border-red-600 transition">
        <img id="mylist-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Profile" class="w-8 h-8 rounded object-cover" />
      </a>
    </div>
  </nav>

  <!-- MAIN MY LIST CONTENT -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight">My List</h1>
        <p class="text-xs text-zinc-400 mt-1">Movies and series saved for later watching.</p>
      </div>
      <span id="mylist-count" class="text-xs font-bold text-red-500 uppercase tracking-wider">0 Saved Items</span>
    </div>

    <!-- Grid Container -->
    <div id="mylist-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
      <!-- Dynamically generated -->
    </div>

    <!-- Empty State -->
    <div id="mylist-empty" class="hidden text-center py-20 max-w-md mx-auto space-y-4">
      <div class="w-20 h-20 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-3xl mx-auto">＋</div>
      <h3 class="text-2xl font-bold text-white">Your list is waiting for something great.</h3>
      <p class="text-xs text-zinc-400 leading-relaxed">Save movies and TV shows to your list so you can easily find them later and watch anytime.</p>
      <a href="/browse/home.html" class="inline-block px-8 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-red-600/30">
        Browse Home
      </a>
    </div>
  </main>

  <footer class="bg-zinc-950 border-t border-zinc-900 py-8 text-center text-zinc-500 text-xs">
    <p>© 2026 Netflix — Educational Portfolio Project</p>
  </footer>

  <!-- auth.js MUST load first: it checks the JWT with the backend
       before the page's real content logic runs below -->
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Real backend-verified auth check (replaces old AppState.requireAuth())
      const user = await Auth.requireAuth();
      if (!user) return; // Auth.requireAuth() already redirected to /login.html

      const profile = AppState.getActiveProfile();
      const avatarEl = document.getElementById("mylist-avatar");
      if (avatarEl) avatarEl.src = profile.avatar;

      renderMyList();

      window.addEventListener("mylist-updated", renderMyList);
    });

    function renderMyList() {
      const savedIds = AppState.getMyList();
      const movies = MOVIES_DATA.filter(m => savedIds.includes(m.id));
      
      const grid = document.getElementById("mylist-grid");
      const empty = document.getElementById("mylist-empty");
      const countEl = document.getElementById("mylist-count");

      if (countEl) countEl.textContent = `${movies.length} Saved Items`;

      if (movies.length === 0) {
        grid.classList.add("hidden");
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");
      grid.classList.remove("hidden");

      grid.innerHTML = movies.map(m => `
        <div class="movie-card group w-full" data-movie-id="${m.id}">
          <img src="${m.poster}" alt="${m.title}" class="w-full h-72 object-cover" />
          
          <div class="movie-card-overlay absolute inset-0 p-3 flex flex-col justify-end">
            <h3 class="text-xs font-bold text-white line-clamp-1">${m.title}</h3>
            <span class="text-[10px] text-emerald-400 font-semibold mt-0.5">★ ${m.rating} • ${m.year}</span>

            <div class="flex items-center gap-2 mt-3">
              <button class="card-play-btn p-2 rounded-full bg-white text-black hover:bg-zinc-200 transition cursor-pointer" title="Play">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>

              <button class="remove-btn p-2 rounded-full bg-red-600/80 hover:bg-red-600 text-white transition ml-auto cursor-pointer" title="Remove from My List">
                ✕
              </button>
            </div>
          </div>
        </div>
      `).join('');

      const cards = grid.querySelectorAll(".movie-card");
      cards.forEach(card => {
        const id = card.getAttribute("data-movie-id");
        card.onclick = (e) => {
          if (e.target.closest(".card-play-btn")) {
            e.stopPropagation();
            openVideoPlayer(id);
          } else if (e.target.closest(".remove-btn")) {
            e.stopPropagation();
            AppState.toggleMyList(id);
            renderMyList();
          } else {
            openMovieDetails(id);
          }
        };
      });
    }
  </script>
</body>
</html>
