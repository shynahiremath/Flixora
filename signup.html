<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Netflix</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col justify-between antialiased relative overflow-x-hidden">

  <!-- Interactive 3D Parallax Background Mesh -->
  <div id="auth-bg-mesh" class="auth-mesh-layer"></div>

  <!-- Header -->
  <header class="p-6 md:px-12 flex items-center justify-between z-10 auth-header-animate">
    <a href="/index.html" class="text-3xl font-black tracking-wider text-red-600 font-mono hover:scale-105 transition duration-300">NETFLIX</a>

    <div class="flex items-center gap-3">
      <!-- Language Switcher Dropdown -->
      <div class="relative">
        <button onclick="toggleLangMenu()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 text-zinc-200 border border-zinc-700 text-xs font-bold transition cursor-pointer" title="Switch Language">
          <span>🌐</span>
          <span id="current-lang-label">English</span>
          <span class="text-[10px] text-zinc-400">▼</span>
        </button>
        <div id="lang-dropdown-menu" class="hidden absolute right-0 mt-2 w-40 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl p-2 z-50 animate-fade-in text-xs font-bold space-y-1">
          <button onclick="setAppLanguage('en')" class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-zinc-800 text-zinc-200 transition cursor-pointer">
            <span>English</span>
            <span id="check-lang-en" class="text-red-500">✓</span>
          </button>
          <button onclick="setAppLanguage('hi')" class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-zinc-800 text-zinc-200 transition cursor-pointer">
            <span>हिंदी (Hindi)</span>
            <span id="check-lang-hi" class="text-red-500 hidden">✓</span>
          </button>
        </div>
      </div>
      <a href="/login.html" class="text-xs font-bold text-zinc-300 hover:text-white uppercase tracking-wider" data-i18n="signin_title">Sign In</a>
    </div>
  </header>

  <!-- Signup Main Container -->
  <main class="flex-grow flex items-center justify-center p-4 relative z-10">
    <div id="auth-interactive-card" class="auth-card p-8 md:p-10 my-8">
      <h1 class="text-3xl font-black text-white mb-2 auth-field-1">Create Account</h1>
      <p class="text-xs text-zinc-400 mb-6 auth-field-1">Start your 30-day simulated unlimited streaming trial.</p>

      <form id="signup-form" class="space-y-4">
        <div class="auth-field-2">
          <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Full Name</label>
          <input type="text" id="signup-name" required placeholder="John Doe" class="auth-input" />
        </div>

        <div class="auth-field-3">
          <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Email Address</label>
          <input type="email" id="signup-email" required placeholder="name@example.com" class="auth-input" />
        </div>

        <div class="auth-field-4">
          <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="signup-password" required placeholder="At least 6 characters" class="auth-input pr-16" />
            <button type="button" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-zinc-400 hover:text-white">SHOW</button>
          </div>
        </div>

        <div class="auth-field-4">
          <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Confirm Password</label>
          <input type="password" id="signup-confirm-password" required placeholder="Repeat password" class="auth-input" />
        </div>

        <div class="auth-field-5">
          <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-1.5">Date of Birth</label>
          <input type="date" id="signup-dob" required class="auth-input text-zinc-300" />
        </div>

        <div class="flex items-center gap-2 pt-2 auth-field-5">
          <input type="checkbox" id="signup-terms" required class="w-4 h-4 accent-red-600 rounded cursor-pointer" />
          <label for="signup-terms" class="text-xs text-zinc-400 cursor-pointer">
            I agree to Netflix's <a href="#" class="text-zinc-200 underline">Terms of Use</a> & <a href="#" class="text-zinc-200 underline">Privacy Policy</a>.
          </label>
        </div>

        <div class="auth-field-6">
          <button type="submit" id="signup-submit-btn" class="auth-btn mt-4 cursor-pointer">
            Create Account
          </button>
        </div>
      </form>

      <div class="mt-6 text-xs text-zinc-400 text-center auth-field-6">
        Already have an account? <a href="/login.html" class="text-white font-bold hover:underline">Sign in here</a>.
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 text-center text-xs text-zinc-600 border-t border-zinc-900">
    <p>© 2026 Netflix — Educational Frontend Demo</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
